<div class="modal-backdrop" (click)="onClose()"></div>
<div class="modal-content" (click)="$event.stopPropagation()">
  <h2>{{ product.Name }}</h2>
  <img [src]="product.Img" alt="{{ product.Name }}" width="200" />
  <p>Price: {{ product.Price }} EGP</p>
  <p>Category: {{ getCategoryName(product.CategoryID) }}</p>
  <p>Quantity: {{ product.Quantity }}</p>
  <button class="btn btn-close2 mt-2  " [routerLink]="['/products', product.ID]" (click)="onClose()">
    View Full Details
  </button>
  <button class="btn-close2" (click)="onClose()">Close</button>
</div>
