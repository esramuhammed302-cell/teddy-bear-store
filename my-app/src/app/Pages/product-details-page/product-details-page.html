 <div class="container mt-5 text-center" *ngIf="product">
      <h2>{{ product.Name }}</h2>

      <img [src]="product.Img" width="300" />

      <p class="mt-3">Price: {{ product.Price }} EGP</p>
      <p>Quantity: {{ product.Quantity }}</p>

      <button routerLink="/products" class="btn mt-3">
        Back
      </button>
    </div>
